<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat assistant</title>
    <link rel="preload" href="/static/fonts/plus-jakarta-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/widget/theme.css?v=__V__">
    <link rel="stylesheet" href="/static/widget/widget.css?v=__V__">
    <script id="widgetbot-config" type="application/json">__CONFIG__</script>
    <script src="/static/vendor/purify.min.js?v=__V__" defer></script>
    <script src="/static/widget/app.js?v=__V__" defer></script>
</head>
<body>
    <div class="app">
        <section class="view view-chat" id="view-chat">
            <header class="header">
                <div class="brand">
                    <div id="brand-mark"></div>
                    <div class="status">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span>Assistant · <span class="status-long">replies instantly</span><span class="status-short">online</span></span>
                    </div>
                </div>
                <button type="button" class="icon-btn" id="btn-history" aria-label="History" title="History" hidden>
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                </button>
                <button type="button" class="icon-btn" id="btn-new" aria-label="New chat" title="New chat">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14B8D8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
                <button type="button" class="icon-btn btn-close" id="btn-close" aria-label="Close chat" title="Close chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                </button>
            </header>

            <div class="messages" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>

            <footer class="composer">
                <form class="input-pill" id="composer">
                    <label class="sr-only" for="input">Message</label>
                    <textarea id="input" rows="1" autocomplete="off"></textarea>
                    <button type="submit" class="send" id="send" aria-label="Send" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
                    </button>
                </form>
                <p class="privacy" id="privacy">Chats are saved to improve answers</p>
            </footer>
        </section>

        <section class="view view-history" id="view-history" aria-hidden="true" inert>
            <header class="header">
                <button type="button" class="icon-btn" id="btn-back" aria-label="Back to chat" title="Back to chat">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                </button>
                <h1 class="history-title">Your chats</h1>
                <button type="button" class="icon-btn" id="btn-new-from-history" aria-label="New chat" title="New chat">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#14B8D8" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                </button>
            </header>
            <div class="history-list" id="history-list"></div>
            <p class="history-note">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5B6170" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
                Chats are kept on this device only
            </p>
        </section>
    </div>
</body>
</html>
